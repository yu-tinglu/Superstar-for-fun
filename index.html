<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>明星模擬器</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--b0,#120a2a);color:#f5f0ff;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{background:radial-gradient(circle at 20% 10%,var(--b1,#3a1f6e) 0,transparent 45%),radial-gradient(circle at 85% 90%,var(--b2,#6b1f5e) 0,transparent 40%),var(--b0,#120a2a);background-attachment:fixed}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 24px)}
h1{font-size:30px;text-align:center;margin:24px 0 4px;background:linear-gradient(90deg,#ffd76a,#ff8ad8);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:6px 0 10px;font-size:19px}
.sub{text-align:center;opacity:.75;margin-bottom:20px;font-size:14px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:12px;margin-bottom:10px;backdrop-filter:blur(6px)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{display:block;width:100%;padding:13px;margin-bottom:9px;border-radius:14px;background:linear-gradient(135deg,var(--a1,#7c4dff),var(--a2,#d94fd0));font-weight:700;font-size:15.5px;text-align:left;box-shadow:0 4px 14px rgba(124,77,255,.35)}
.btn small{display:block;font-weight:400;opacity:.88;margin-top:3px;font-size:12.5px;line-height:1.45}
.btn.alt{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid rgba(255,255,255,.2)}
.btn.gold{background:linear-gradient(135deg,#ffb83d,#ff7a59)}
.btn.sel{background:linear-gradient(135deg,#ffb83d,#ff7a59);border-color:transparent}
.btn.cp{padding:10px 13px;font-size:14.5px}
.btn.cp small{font-size:12px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.98)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.grid .btn{margin:0;text-align:center;padding:11px 6px;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:13px}
.chip.sel{background:#ffb83d;color:#2b1a00;font-weight:700;border-color:transparent}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;margin-bottom:8px}
.pill{background:rgba(255,255,255,.12);padding:4px 10px;border-radius:99px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;margin-top:6px}
.mini{display:flex;align-items:center;gap:5px;font-size:12px}
.mini b{width:30px;font-weight:600;white-space:nowrap}
.mini .bar{flex:1;height:7px}
.mini span{width:24px;text-align:right;opacity:.9}
.bar{background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
details.mem{padding:9px 12px}
details summary{cursor:pointer;list-style:none;font-size:14px}
details summary::-webkit-details-marker{display:none}
details summary small{opacity:.7;font-size:11.5px;margin-left:4px}
details .g2{margin-top:8px}
.log p{margin:6px 0;line-height:1.55}
.ev{border-left:3px solid #ffd76a;padding-left:10px;display:block}
.big{font-size:44px;text-align:center;margin:6px 0;animation:pop .5s both}
.center{text-align:center}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#ffd76a;color:#3a2a00;font-weight:700;margin-bottom:6px}
.back{background:none;opacity:.65;font-size:13px;padding:6px 0;margin-bottom:2px}
.delta{font-size:13px;opacity:.95;margin:6px 0 0;line-height:1.7}
.up{color:#7dffb0}.dn{color:#ff8a8a}
.up,.dn{display:inline-block;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.cf{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.cf span{position:absolute;top:-40px;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.chips.sm .chip{font-size:12px;padding:5px 9px}
.sec{font-size:12px;opacity:.7;margin:10px 0 3px;font-weight:700}
.mt{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.14);margin:2px 4px 0 0}
@keyframes inn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#app>*{animation:inn .3s both}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
</style>
</head>

  function tick(t){x.clearRect(0,0,W,H);S.forEach(s=>{x.globalAlpha=.35+.65*Math.abs(Math.sin(t/900+s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});requestAnimationFrame(tick)}
  addEventListener('resize',init);init();requestAnimationFrame(tick);
})();

    else if(k==='one')mp(G.one||G.m[0],v);
    else if(k==='catk'){const ks=shuffle(CATS.find(c=>c[0]===v[0])[3]).slice(0,2);G.m.forEach(m=>ks.forEach(x=>mp(m,{[x]:v[1]})))}

    else if(k==='leave'){removeMember(v)}
    else if(k==='mleave'){if((G.mates||[]).length>1){G.mates=G.mates.filter(x=>x.n!==v);G.chem=cl(G.chem-5);G.left=(G.left||0)+1;if(G.leader>G.mates.length)G.leader=null}}
    else if(k==='pair'){const a=findMem(v[0]),b=findMem(v[1]);if(a&&b)pairAdd(a,b,v[2])}
    else if(k==='sks'){shuffle(SKK).slice(0,2).forEach(x=>G.m.forEach(m=>m.sk[x]=cl(m.sk[x]+v*.7*(G.mode!=='p'?1.6:1))))}

function removeMember(idx){if(G.m.length<3||idx>=G.m.length)return;
  (G.rels||[]).forEach(r=>{if(r.mi===idx)r.gone=true;else if(r.mi>idx&&!r.gone)r.mi--});
  (G.q2||[]).forEach(e=>{if(e.mi===idx)e.mi=0;else if(e.mi>idx)e.mi--});
  G.m.splice(idx,1);
  if(G.leader===idx)G.leader=null;else if(G.leader>idx)G.leader--;
  if(G.center===idx)G.center=null;else if(G.center>idx)G.center--;

function aPerform(k){
  const st=G.styles[k],m=G.m[0],s0=snap();
  const W=SH().wj[G.r],base=st.k.reduce((a,x)=>a+m.sk[x],0)/st.k.length,pref=m.sk[prefK()];
  const f=(0.75+m.mood/200)*(m.stress>70?.85:1)*(m.energy<25?.9:1)*(G.mm||1);
  const judge=cl((base*.8+pref*.2)*f+R(-10,10)*st.risk,0,100);
  const aud=Math.min(100,cl(32+(lookAvg()-50)*.15+G.fame*.6+G.fans/12+G.buzz*.5,0,100)*st.ap);
  const mine=(judge*W+aud*(1-W))*(.9+.1*fitv());
  const field=G.alive.map(i=>{const v=G.rivals[i],vm=v.m;
    let bs=0;shuffle(STY).slice(0,3).forEach(x=>{const b=x.k.reduce((a,kk)=>a+vm.sk[kk],0)/x.k.length;if(b>bs)bs=b});
    const j=cl((bs*.8+vm.sk[prefK()]*.2)*(.9+vm.p.confid/500)+G.r*(SH().rj!==undefined?SH().rj:RB1)+(SH().rbias||0)+R(-8,8),0,100);
    const au=cl((SH().ra!==undefined?SH().ra:RB0)+G.r*(SH().rb!==undefined?SH().rb:RB2)+vm.p.extro/6+R(-8,8),0,100);
    return {i,n:v.n,m:vm,s:j*W+au*(1-W)}});
  field.push({n:'你',s:mine,me:true});
  field.sort((a,b)=>b.s-a.s);
  const total=field.length,rank=field.findIndex(x=>x.me)+1,K=SH().keep[G.r];
  const final=G.r===4,survive=final?true:rank<=K;
  G.last={rank,total,judge,aud,st,field,survive,final};
  if(final&&SH().debut){G.last.debut=rank<=SH().debut;G.last.dn=SH().debut}
  const gain=Math.round((total+1-rank)/total*100);
  const M=M_();
  const e={fans:gain*M.fm,fame:2+gain/25,buzz:gain/6,all:{stress:6,energy:-14}};
  if(st.n==='原創作品')e.rep=2+judge/30;
  ef(e);track();
  const notes=[];
  if(survive&&!final&&Math.random()<.4){const ev=pick(AEV);G.one=m;const sb=snap();ef(ev.e);notes.push(`<span class="ev">${ev.t}</span>`)}
  if(survive&&!final)G.alive=field.slice(0,K).filter(x=>!x.me).map(x=>x.i);
  if(!survive)G.alive=field.slice(0,K).filter(x=>!x.me).map(x=>x.i);
  const rows=field.slice(0,Math.min(5,total)).map((x,i)=>`<div class="mini" style="margin:3px 0;font-size:13px"><b style="width:26px">${i+1}.</b><span style="flex:1;text-align:left;${x.me?'color:#ffd76a;font-weight:700':''}">${x.me?'⭐ 你':x.n+`<small style="opacity:.55;margin-left:6px">${AR[x.m.a][0]}·${tr(x.m).n}</small>`}</span><span style="width:40px">${Math.round(x.s)}</span></div>`).join('');
  const verdict=final?(SH().debut?(rank<=SH().debut?`🎉 你以第 ${rank} 名進入出道位(前 ${SH().debut} 名)!`:`💔 你以第 ${rank} 名,差一點就進入出道位(前 ${SH().debut} 名)。`):(rank===1?'🏆 你成為了冠軍!':`你在總決賽拿下第 ${rank} 名。`)):survive?`✅ 你以第 ${rank} 名晉級下一關(取前 ${K} 名)`:`❌ 你以第 ${rank} 名遭到淘汰(取前 ${K} 名)`;
  app.innerHTML=panel(hdrA())+`<div class="card"><h2>${st.e} ${st.n}</h2><p>評審 ${Math.round(judge)} · 觀眾 ${Math.round(aud)} · 綜合 ${Math.round(mine)}</p>${rows}${total>5&&rank>5?`<div class="mini" style="font-size:13px"><b style="width:26px">${rank}.</b><span style="flex:1;color:#ffd76a;font-weight:700">⭐ 你</span><span style="width:40px">${Math.round(mine)}</span></div>`:''}</div>
  <div class="card log"><p>${verdict}</p>${notes.map(x=>`<p>${x}</p>`).join('')}${diff(s0,snap())}</div>
  <details class="card"><summary>👀 對手檔案(前 4 名,各 27 項數值)</summary>${field.filter(x=>!x.me).slice(0,4).map(x=>memD(x.m,'對手 · ')).join('')}</details>`+
  B(final||!survive?'看結果 →':'下一關 →','','aNext()');
}

  G.res={sc,lab};
  app.innerHTML=`<div class="card center"><div class="big">${e}</div><h2>${shw.e} ${shw.n}:${t}</h2><p style="line-height:1.7">${txt}</p>${G.gname&&L.debut?`<div class="card"><b>👯 ${G.gname}(${G.dm.length+1} 人)</b><p style="font-size:13px;line-height:1.7">${[m].concat(G.dm).map(x=>(x.nat?FLAG(x.nat)+' ':'')+x.n).join('、')}</p></div>`:''}
  <p class="delta">人氣 ${Math.round(G.fame)} · 粉絲 ${G.fans} · 口碑 ${Math.round(G.rep)}</p></div>
  ${outBlock('a',lab)}${achBlock('a',lab)}<details class="card"><summary>📊 查看全部數值</summary>${panel('最終').replace(/<details class="card mem"/g,'<details class="mem" open')}</details>`+
  B(G.gname&&L.debut?'🌟 以組合身分踏入演藝圈':'🌟 帶著這份人氣踏入演藝圈',G.gname&&L.debut?'帶著出道隊友進入「做明星」的出道階段':'用選秀的成績直接進入「做明星」的出道階段','aToStar()','gold')+
  B('🔁 再參加一次選秀','','natSelect("a")')+B('回首頁','','home()','alt');
  if(sc>=80)confetti();
}
function aToStar(){
  const g=G,me=g.m[0],sc=g.res.sc;
  me.energy=80;me.mood=cl(me.mood,50,100);me.stress=cl(me.stress-10);
  const b=sc>=100?{fame:12,fans:400,money:600}:sc>=80?{fame:6,fans:200,money:300}:{fame:2,fans:60,money:0};
  const gd=g.dm&&g.last&&g.last.debut?g.dm:null;
  MKID=g.mk;
  G={mode:'s',mk:g.mk,m:[me],ch:1,n:0,money:g.money+b.money,fans:g.fans+b.fans,fame:cl(g.fame+b.fame),rep:g.rep,image:g.image,network:g.network,buzz:g.buzz,chem:50,group:false,q:[],log:[],dif:'',note:''};
  G.hist=g.hist||[];G.sc=g.sc||0;G.mates=[];G.rels=[];
  if(gd){G.group=true;G.mates=gd;G.gname=g.gname;G.chem=cl(55+Math.round((gd.reduce((a,x)=>a+x.p.agree,0)/gd.length-50)/3)+(g.show==='gal'?-6:0));}G.br=0;G.who=0;G.q2=[];G.pt=0;
  G.q=CHAP.map((_,i)=>shuffle([MEV[MKID][i],Math.random()<.55?genDyn():rotPick(GENEV[i],'g'+i)]));
  sFocus();
}

function recalcFit(){
  if(G.mode==='p'){const a=G.m.map(m=>m.nat?FITN[m.nat][G.mk]:1);G.fit0=a.reduce((x,y)=>x+y,0)/a.length}
  else G.fit0=FITN[G.nat||NAT][G.mk]}
function fitv(){if(G.fit0===undefined)recalcFit();const lang=G.m.reduce((a,m)=>a+m.sk.lang,0)/G.m.length;return cl(G.fit0+(lang-25)/160,.25,1)}
const fitMul=()=>.62+.38*fitv();
function mktReq(mk){const f=G.fit0===undefined?1:FITN[G.mode==='p'?(G.m[0].nat||'tw'):(G.nat||NAT)][mk];return {fame:f>=.8?14:f>=.6?20:28,cost:Math.round(600+(1-f)*1400)}}
function expandMenu(){
  ensureX();const back=G.mode==='p'?'pHub()':'sPersonal()',hd=G.mode==='p'?hdrP():hdrS();
  app.innerHTML=panel(hd)+`<button class="back" onclick="${back}">← 返回</button><h2>🌏 拓展市場</h2><div class="card" style="font-size:13px;line-height:1.7">目前所在:<b>${MK[G.mk].e} ${MK[G.mk].n}</b>(適應度 ${Math.round(fitv()*100)}%)<br>各市場知名度:${(G.mks||[]).map(k=>`${MK[k].e}${Math.round(G.ms[k]||0)}`).join(' ')}<br><span style="opacity:.75">語言(外語)能力越高,適應度越高。到不同市場,事件、收入、壓力與特色活動都會改變;在多個市場打出知名度,能成為真正的國際巨星。</span></div>`+
  MKORDER.filter(k=>unlM(k)||(G.mks||[]).includes(k)).map(k=>{const M=MK[k],un=(G.mks||[]).includes(k),rq=mktReq(k),cur=G.mk===k;
    if(un)return B(`${M.e} ${M.n}${cur?'(目前)':''}`,cur?'你正在這個市場':`切換到這裡發展(旅費 $150)`,`switchMk("${k}")`,cur?'sel':'alt cp',cur||G.money<150);
    return B(`${M.e} ${M.n}(尚未進軍)`,`需要 人氣 ${rq.fame}、資金 $${rq.cost} · ${G.mode==='p'?'製作人':'你的'}適應度 ${Math.round((G.mode==='p'?G.m.reduce((a,m)=>a+FITN[m.nat||'tw'][k],0)/G.m.length:FITN[G.nat||NAT][k])*100)}%`,`goMk("${k}")`,'gold cp',G.fame<rq.fame||G.money<rq.cost)}).join('');
}
function regenFuture(){if(G.mode!=='s'||!G.q)return;for(let i=G.ch+1;i<5;i++){const a=MEV[G.mk][i];let b;if(Math.random()<.55)b=genDyn();else if(G.group&&Math.random()<.5)b=GEV[i];else b=rotPick(GENEV[i],'g'+i);G.q[i]=shuffle([a,b])}}
function applyMk(k){G.mk=k;recalcFit();regenFuture();G.sale=undefined;newSale()}
function switchMk(k){const s0=snap();G.money-=150;applyMk(k);G.m.forEach(m=>mp(m,{energy:-8}));commit(`✈️ 你轉移到${MK[k].e} ${MK[k].n},新的環境與新的挑戰。`,s0)}
function goMk(k){
  const s0=snap(),rq=mktReq(k),f0=G.mode==='p'?G.m.reduce((a,m)=>a+FITN[m.nat||'tw'][k],0)/G.m.length:FITN[G.nat||NAT][k];
  G.money-=rq.cost;const lang=G.m.reduce((a,m)=>a+m.sk.lang,0)/G.m.length;
  const pr=cl(.3+(f0-.4)*.55+(lang-25)/220+(G.fame-rq.fame)/220+(pavg('luck')-50)/400,.2,.9);
  G.mks=G.mks||[G.mk];G.ms=G.ms||{};
  if(Math.random()<pr){G.mks.push(k);G.ms[k]=15;applyMk(k);ef({buzz:12,fame:2,network:4});G.m.forEach(m=>mp(m,{energy:-10,lang:2}));
    commit(`🌏 進軍${MK[k].e} ${MK[k].n}成功!當地媒體與業界注意到你,但一切從頭開始。`,s0)}
  else{ef({image:-2});G.m.forEach(m=>mp(m,{stress:6,mood:-6,energy:-10}));
    commit(`⚠️ 進軍${MK[k].e} ${MK[k].n}受挫:語言與文化差異讓宣傳效果不佳。你損失了一筆資金,但也累積了經驗。`,s0)}
}

const _ef=ef;
ef=function(e){
  if(e&&G&&G.xs&&G.mode==='s'&&((e.fame>0)||(e.rep>0))){e=Object.assign({},e);if(e.fame>0)e.fame*=.4;if(e.rep>0)e.rep*=.45}
  if(e&&(e.cast||e.heat!==undefined||e.later||e.inj||e.sal)){
    const x=X();e=Object.assign({},e);
    if(e.cast){const cs=Array.isArray(e.cast[0])?e.cast:[e.cast];cs.forEach(c=>{x.cast[c[0]]=cl((x.cast[c[0]]===undefined?50:x.cast[c[0]])+c[1])});delete e.cast}
    if(e.heat!==undefined){x.heat=cl(x.heat+(e.heat>0?e.heat*(G.mode==='s'?2.4:1.6):e.heat));delete e.heat}
    if(e.later){x.later.push({id:e.later[0],due:x.turn+e.later[1]});delete e.later}
    if(e.inj){const m=G.one||G.m[0];m.inj=Math.max(m.inj||0,e.inj[0]);delete e.inj}
    if(e.sal){x.sal+=e.sal;delete e.sal}
  }
  return _ef(e);
};

function worldTick(evs,notes){const x=X();if(!x.world)return;
  x.world.forEach(n=>{n.f=cl(n.f+(48-n.f)*.06+R(-4,4)+(n.hot||0));n.hot=(n.hot||0)*.5});
  if(Math.random()<.5){const n=pick(x.world),o=pick(x.world.filter(z=>z!==n)),r=Math.random();let s;
    if(r<.3){n.f=cl(n.f+7);n.hot=2;s=`🎵 ${n.n}的新作空降榜首`}
    else if(r<.5){n.f=cl(n.f-9);s=`🗞️ ${n.n}爆出醜聞,人氣下滑`}
    else if(r<.7){n.f=cl(n.f+4);s=`📺 ${n.n}的新劇收視亮眼`}
    else if(r<.85){n.f=cl(n.f+2);o.f=cl(o.f+2);s=`🤝 ${n.n}與${o.n}宣布合作`}
    else{n.f=cl(n.f-5);s=`🌙 ${n.n}宣布暫停活動`}
    x.news.unshift(s);x.news=x.news.slice(0,8);notes.push('📰 '+s);
    if(Math.abs(n.f-myPow())<9&&Math.random()<.35&&r<.3)evs.push(Object.assign(DIL[9](X().names),{timed:12,id:'D9'}))}
}

function x2Tick(mode){
  const x=X(),evs=[],notes=[];x.turn++;const k=mode==='p'?1:2.5;
  x.heat=cl(x.heat-2);if(x.chal==='heat')x.heat=cl(x.heat+2);if(x.chal==='iron')G.m.forEach(m=>mp(m,{energy:-8,stress:5}));
  const c=x.cast;
  if(c.agent>=70)ef({money:60*k});else if(c.agent<=30)ef({money:-40*k});
  if(c.senior>=70)ef({network:.8*k});
  if(c.press>=70)ef({buzz:2*k});else if(c.press<=30)ef({image:-.6*k});
  if(c.fan>=70)ef({fans:40*k});else if(c.fan<=30)ef({fans:-25*k});
  G.m.forEach(m=>{if(!(m.inj>0)&&m.stress>=78&&m.energy<28&&Math.random()<.2){m.inj=2;notes.push(`🩹 ${m.n}過度勞累而受傷了,需要休養。`)}});
  G.m.forEach(m=>{if(m.inj>0){mp(m,{energy:-12,mood:-3});m.inj--;if(m.inj===0)notes.push(`🩹 ${m.n}的傷勢痊癒了。`)}});
  if(mode==='p'){
    let up=0;Object.values(x.co).forEach(l=>up+=l);G.money-=15*up+x.sal;
    const co=x.co;
    if(co.tr)G.m.forEach(m=>mp(m,{[pick(SKK)]:.8*co.tr}));
    if(co.st)ef({rep:.4*co.st,money:30*co.st});
    if(co.sy){G.m.forEach(m=>mp(m,{hair:co.sy,skin:.8*co.sy}));ef({image:.4*co.sy})}
    if(co.pr)ef({buzz:2*co.pr,fans:15*co.pr});
    if(co.md){G.m.forEach(m=>{mp(m,{stress:-1.5*co.md});if(m.inj>0&&co.md>=2)m.inj--})}
    if(G.week%4===0){const net=Math.round(G.money-(x.m0||G.money));notes.push(`📊 月報:本月資金${net>=0?'增加':'減少'} $${Math.abs(net)},目前 $${Math.round(G.money)}。`);x.m0=G.money}
    if((G.week===Math.round((G.len||16)*.3)||G.week===Math.round((G.len||16)*.65))&&Math.random()<.8)evs.push(contractEv());
  }
  worldTick(evs,notes);
  // 到期的人物回報
  const due=x.later.filter(l=>l.due<=x.turn);x.later=x.later.filter(l=>l.due>x.turn);
  due.forEach(l=>{const e=payEv(l.id);if(e)evs.push(e)});
  // 人物關係極端時,偶爾自發出現
  if(!due.length){Object.keys(CASTD).forEach(id=>{const b=c[id];if((b>=76||b<=24)&&Math.random()<.1){const e=payEv(id);if(e)evs.push(e)}})}
  // 醜聞
  if(x.heat>=35&&Math.random()<(x.heat-25)/75){evs.unshift(heatEv());x.heat=Math.max(25,x.heat-15)}
  // 兩難
  if(Math.random()<(mode==='p'?.5:.85)){const di=rotIdx(DIL,'d'),e=DIL[di](x.names);e.id='D'+di;e.timed=e.timed||12;evs.unshift(e)}
  {const d0=load();d0.sp=d0.sp||{};const si=d0.sp[G.mk]||0;
   if(si<6&&STORY[G.mk]&&x.turn>=(mode==='p'?2:1)&&x.turn-(x.lastSt===undefined?-9:x.lastSt)>=(mode==='p'?3:1)){x.lastSt=x.turn;d0.sp[G.mk]=si+1;save(d0);evs.unshift(storyBeat(G.mk,si))}}
  scenCheck(notes);
  msCheck(notes);
  evs.forEach(e=>e.x2=1);
  return {evs,notes};
}

 ['🏁 結果','做完一局會得到評級或稱號,並累積經驗解鎖新內容。第一局建議選「快速」,約 4 分鐘就能看到結果。']];
function tourGo(i){if(i>=TOUR.length){const d=load();d.tour=1;d.seen=1;save(d);return home()}
  const t=TOUR[i];app.innerHTML=`<div class="card center" style="font-size:12px;opacity:.8">導覽 ${i+1}/${TOUR.length}</div><div class="card" style="line-height:1.9;font-size:15px"><h2 style="margin:0 0 8px">${t[0]}</h2>${t[1]}</div>`+B(i+1<TOUR.length?'下一步 →':'開始玩 🎉','',`tourGo(${i+1})`,'gold')+B('略過','','tourGo(99)','alt')}

// ---- 9. 多存檔與匯出入 ----
const SLK=i=>'stargame2_slot'+i;
function slotInfo(i){try{const r=JSON.parse(localStorage.getItem(SLK(i))||'null');if(!r||!r.r||!r.r.G)return null;const g=r.r.G,M=MK[g.mk]||{e:'',n:''};
  return `${M.e} ${g.mode==='p'?`製作人 第 ${g.week}/${g.len||16} 週`:g.mode==='s'?`做明星 階段 ${(g.cc||0)+1}/${g.slen||5}`:'選秀'} · ${r.t||''}`}catch(e){return null}}
function slotSave(i){try{const cur=localStorage.getItem(RUNK);if(!cur){return slotMenu('目前沒有進行中的遊戲可存')}
  const n=new Date(),t=`${n.getMonth()+1}/${n.getDate()} ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  localStorage.setItem(SLK(i),JSON.stringify({t,r:JSON.parse(cur)}));slotMenu('已存入欄位 '+i)}catch(e){slotMenu('存檔失敗')}}
function slotLoad(i){try{const r=JSON.parse(localStorage.getItem(SLK(i))||'null');if(!r||!r.r)return slotMenu('這格是空的');localStorage.setItem(RUNK,JSON.stringify(r.r));resumeGame()}catch(e){slotMenu('讀取失敗')}}
function slotDel(i){try{localStorage.removeItem(SLK(i))}catch(e){}slotMenu('已清除欄位 '+i)}
function slotMenu(msg){
  app.innerHTML=`<button class="back" onclick="setMenu()">← 回設定</button><h2>💾 存檔管理</h2>`+(msg?`<div class="card center" style="font-size:13px">${msg}</div>`:'')+
  `<div class="card" style="font-size:12.5px;line-height:1.7">遊戲會自動存「目前進度」。這裡可以把目前進度另外存到欄位,之後再讀回。</div>`+
  [1,2,3].map(i=>{const s=slotInfo(i);return `<div class="card"><b>欄位 ${i}</b><div style="font-size:12.5px;opacity:.85;margin:4px 0 8px">${s||'(空)'}</div><div class="grid" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">${B('存入','',`slotSave(${i})`,'alt')}${B('讀取','',`slotLoad(${i})`,'alt',!s)}${B('清除','',`slotDel(${i})`,'alt',!s)}</div></div>`}).join('')+
  B('📤 匯出存檔代碼','換手機或備份用','exportMenu()','alt')+B('📥 匯入存檔代碼','貼上代碼還原','importMenu()','alt')}
const b64e=s=>btoa(unescape(encodeURIComponent(s))),b64d=s=>decodeURIComponent(escape(atob(s)));
function exportCode(){const o={v:1,p:load(),r:null,s:[1,2,3].map(i=>{try{return JSON.parse(localStorage.getItem(SLK(i))||'null')}catch(e){return null}})};try{o.r=JSON.parse(localStorage.getItem(RUNK)||'null')}catch(e){}return 'SG1:'+b64e(JSON.stringify(o))}
function exportMenu(){const c=exportCode();
  app.innerHTML=`<button class="back" onclick="slotMenu()">← 回存檔</button><h2>📤 匯出代碼</h2><div class="card" style="font-size:12.5px;line-height:1.7">複製下面整段文字,存在備忘錄。包含進度、星幣、收藏和三個欄位。</div><textarea id="excode" readonly style="width:100%;height:150px;border-radius:10px;padding:8px;box-sizing:border-box;font-size:11px;background:rgba(0,0,0,.3);color:inherit">${c}</textarea>`+B('📋 複製','','copyCode()','gold')}
function copyCode(){try{const t=document.getElementById('excode');t.select();if(navigator.clipboard)navigator.clipboard.writeText(t.value);else document.execCommand('copy')}catch(e){}}
function importMenu(msg){app.innerHTML=`<button class="back" onclick="slotMenu()">← 回存檔</button><h2>📥 匯入代碼</h2>`+(msg?`<div class="card center" style="font-size:13px">${msg}</div>`:'')+`<div class="card" style="font-size:12.5px;line-height:1.7">貼上以 SG1: 開頭的代碼。匯入會覆蓋目前的進度與收藏。</div><textarea id="imcode" style="width:100%;height:150px;border-radius:10px;padding:8px;box-sizing:border-box;font-size:11px;background:rgba(0,0,0,.3);color:inherit"></textarea>`+B('匯入','','importGo()','gold')}
function importCode(c){c=String(c||'').trim();if(c.indexOf('SG1:')!==0)return '代碼格式不對';let o;try{o=JSON.parse(b64d(c.slice(4)))}catch(e){return '代碼無法讀取'}
  if(!o||o.v!==1||!o.p||typeof o.p!=='object')return '代碼內容不完整';
  save(o.p);try{if(o.r&&o.r.G)localStorage.setItem(RUNK,JSON.stringify(o.r));else localStorage.removeItem(RUNK);(o.s||[]).forEach((s,i)=>{if(s&&s.r)localStorage.setItem(SLK(i+1),JSON.stringify(s));else localStorage.removeItem(SLK(i+1))})}catch(e){}
  ROT=o.p.rot||{};return ''}
function importGo(){let v='';try{v=document.getElementById('imcode').value}catch(e){}const m=importCode(v);if(m)return importMenu(m);loadSet();applyPref();slotMenu('匯入完成')}

// ---- 10. 穩定與效能 ----
let ERRN=0,ERRT=0,ERRLOG=[];
function safeScreen(msg,det){try{stopCD&&stopCD()}catch(e){};AUTOP=0;try{AUTO=null}catch(e){}
  const has=(()=>{try{return !!JSON.parse(localStorage.getItem(RUNK)||'null')}catch(e){return false}})();
  app.innerHTML=`<div class="card center" style="line-height:1.8">⚠️ 發生了一個小問題,已回到安全畫面。<br><span style="font-size:12px;opacity:.7">${escI(msg||'')}</span>${det?`<br><span style="font-size:11px;opacity:.6;word-break:break-all">${escI(det).slice(0,260)}</span>`:''}</div>`+(has?B('▶️ 回到上次存檔','進度不會遺失','resumeGame()','gold'):'')+B('🏠 回首頁','','home()','alt')}
function onErr(m,det){const n=Date.now();ERRLOG.push(String(m)+' '+(det||''));if(ERRLOG.length>10)ERRLOG.shift();if(n-ERRT<1500){if(++ERRN>3)return}else ERRN=0;ERRT=n;try{if(G&&G.mode)saveRun()}catch(e){}safeScreen(String(m).slice(0,60),det)}
try{window.addEventListener('error',e=>{if(e&&e.target&&e.target!==window)return;const m=(e&&e.message)||'';
  if(/^script error\.?$/i.test(m)&&!e.filename&&!e.error){ERRLOG.push('(跨來源腳本錯誤,已略過)');return}
  onErr(m||'error',((e.filename||'').split('/').pop()||'')+':'+(e.lineno||0)+':'+(e.colno||0)+' '+String((e.error&&e.error.stack)||'').split('\n').slice(0,3).join(' | '))});
 window.addEventListener('unhandledrejection',e=>{const r=e&&e.reason;onErr('promise',String((r&&(r.stack||r.message))||r||'').slice(0,200))})}catch(e){}
function trimG(){try{if(G&&G.hist&&G.hist.length>160)G.hist=G.hist.slice(-120);const x=G&&G.x2;if(x){if(x.news&&x.news.length>30)x.news=x.news.slice(-20);if(G.log&&G.log.length>40)G.log=G.log.slice(-20)}}catch(e){}}
const _saveRunD=saveRun;saveRun=function(){trimG();_saveRunD()};
const _endHookD=endHook;endHook=function(m){_endHookD(m);rotSave()};

const _homeD=home;
home=function(){_homeD();try{const d=load();let h=String(app.innerHTML);
  const tour=!d.tour&&!d.xp?B('👋 新手導覽(30 秒)','第一次玩?先看這個','tourGo(0)','gold'):'';
  if(tour)h=h.replace('<div class="sub">',tour+'<div class="sub">');
  const add=B('🛠️ 進階設定','難度、音量、大字、存檔管理','setMenu()','alt');
  h=h.replace('</details>',add+'</details>');
  app.innerHTML=h}catch(e){}};
applyPref();

async function checkUpdate(silent){
  updMsg('⏳ 檢查中……');
  try{const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);
    const r=await fetch(VER_URL+'?t='+Date.now(),{cache:'no-store',signal:c.signal});clearTimeout(t);

      updMsg(`🆕 有新版本 <b>${escI(j.version)}</b>${j.notes?`<br><span style="opacity:.85">${escI(j.notes)}</span>`:''}<br>${/^file:/.test(location.protocol)?`<a href="${DL_URL}" target="_blank" style="color:#ffd76a">前往下載最新版</a>(開啟後按「Download raw file」存檔,取代桌面的舊檔)`:`<a href="${PAGE_URL}" target="_blank" style="color:#ffd76a">前往更新頁面</a>(重新整理即可取得最新版)`}`)}

function domTrait(){const t=X().tr||{};let b=null,bv=0;TGK.forEach(k=>{if((t[k]||0)>bv){bv=t[k];b=k}});return [b,bv]}
function lastOf(g){const l=(X().led||[]);for(let i=l.length-1;i>=0;i--)if(l[i].g===g)return l[i];return null}
function karmaEv(){try{trInit();const x=X(),[b,v]=domTrait();if(!b||v<3)return null;const tier=v>=6?2:1,key=b+tier;if(x.kar[key])return null;
  x.kar[key]=1;const k=KAR[b],ref=lastOf(b),e=JSON.parse(JSON.stringify(k));
  e.t=(tier===2?'再度':'')+TG[b][0]+' '+k.t;e.d=(ref?`因為你曾在「${ref.t}」選擇「${ref.c}」,`:'因為你一路以來的選擇,')+k.d;
  return Object.assign({mi:0,x2:1,id:'K'+key},e)}catch(e){return null}}
const _x2tH=x2Tick;
x2Tick=function(mode){const r=_x2tH(mode);try{const x=G.x2;if(x&&x.turn>=3&&Math.random()<.4){const e=karmaEv();if(e)r.evs.unshift(e)}}catch(e){}return r};

// ---- 足跡與結語 ----
function chipOf(ch){if(!ch)return '';const up=ch[0]==='stress'?ch[1]<0:ch[1]>0;return `<span class="${up?'up':'dn'}">${SLB[ch[0]]||ch[0]} ${ch[1]>0?'+':''}${ch[1]}</span>`}
function ledRows(n){const l=(X().led||[]).slice(-n).reverse();return l.map(e=>`<div style="font-size:13px;line-height:1.9;display:flex;gap:6px;align-items:center;flex-wrap:wrap">${e.g?TG[e.g][0]:'▫️'} <b>${escI(e.t)}</b> <span style="opacity:.75">→ ${escI(e.c)}</span> ${chipOf(e.ch)}</div>`).join('')}
function traitBars(){const t=X().tr||{},mx=Math.max(3,...TGK.map(k=>t[k]||0));return `<div class="g2">`+TGK.map(k=>`<div class="mini"><b style="width:auto;min-width:64px">${TG[k][0]} ${TG[k][1]}</b><div class="bar"><i style="width:${(t[k]||0)/mx*100}%;background:#ffd76a"></i></div><span>${t[k]||0}</span></div>`).join('')+`</div>`}
function styleName(){const [b,v]=domTrait();return b&&v>=2?TG[b][1]:'尚未定型'}
function ledgerMenu(){trInit();const back=G.mode==='p'?'pHub()':'sFocus()';
  app.innerHTML=`<button class="back" onclick="${back}">← 返回</button><h2>🧭 足跡</h2><div class="card center"><div style="font-size:12px;opacity:.7">目前作風</div><div style="font-size:20px;font-weight:800;margin:4px 0">${styleName()}</div></div><div class="card">${traitBars()}</div><div class="card"><b style="font-size:13px">最近的抉擇與結果</b><div style="margin-top:6px">${ledRows(12)||'<span style="font-size:13px;opacity:.7">還沒有紀錄</span>'}</div></div>`}
function ledgerCard(n){trInit();if(!(X().led||[]).length)return '';return `<div class="card"><b style="font-size:13px">🧭 這一路的關鍵抉擇 · 作風:${styleName()}</b><div style="margin-top:6px">${ledRows(n)}</div></div>`}
const _endHookH=endHook;endHook=function(m){_endHookH(m);try{if(G&&G.x2&&(m==='p'||m==='s'))app.innerHTML+=ledgerCard(5)}catch(e){}};

// ---- 幕間 ----
const ACTS=[['序幕','起步','🌱'],['第二幕','崛起','🚀'],['第三幕','風暴','🌪️'],['終幕','舞台','🏆']];
function actLine(){const l=(X().led||[]).slice(-2);return l.length?l.map(e=>`${e.g?TG[e.g][0]:'▫️'} ${escI(e.t)} ${chipOf(e.ch)}`).join('<br>'):''}
function actCard(i){const a=ACTS[i];return `<div class="card center" style="border-color:rgba(255,215,106,.5)"><div style="font-size:12px;opacity:.7">${a[0]}</div><div style="font-size:19px;font-weight:800;margin:2px 0">${a[2]} ${a[1]}</div>${actLine()?`<div style="font-size:12.5px;line-height:1.8;margin-top:6px">${actLine()}</div>`:''}</div>`}
function actIdx(){if(G.mode==='p'){const L=G.len||16,w=G.week||1;return w>=L*.75?3:w>=L*.5?2:w>=L*.25?1:0}
  if(G.mode==='s'){const c=G.cc||0,n=G.slen||5;return c>=n-1?3:c>=n*.6?2:c>=n*.3?1:0}return -1}
function actMaybe(){try{trInit();const x=X(),i=actIdx();if(i<0||x.act[i])return '';x.act[i]=1;if(i===0&&(G.mode==='p'?G.week>1:(G.cc||0)>0))return '';return actCard(i)}catch(e){return ''}}
const _pHubH=pHub;pHub=function(){scr('game');_pHubH();const c=actMaybe();if(c)app.innerHTML=c+app.innerHTML;app.innerHTML+=B('🧭 足跡',styleName(),'ledgerMenu()','alt')};
const _sFocusH=sFocus;sFocus=function(){scr('game');_sFocusH();const c=actMaybe();if(c){app.innerHTML=c+app.innerHTML;LASTF=app.innerHTML}app.innerHTML+=B('🧭 足跡',styleName(),'ledgerMenu()','alt');LASTF=app.innerHTML};

(function(){try{const s=document.createElement('style');s.id='hcss';
 s.textContent='.delta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}.delta span{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.08)}.delta span.up,.up{color:#7dffb0}.delta span.dn,.dn{color:#ff8fa3}.delta span.up{background:rgba(125,255,176,.12)}.delta span.dn{background:rgba(255,143,163,.12)}.prog{height:6px;margin:0 0 10px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffd76a,#ff7ab8)}html.concise #app[data-scr=menu] .btn small{display:none}html.concise #app[data-scr=menu] .card[style*="line-height:1.7"]:not(.center){display:none}';
 document.head.appendChild(s)}catch(e){}})();
